name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate library, presets and evaluation cases
        run: python3 scripts/check-library.py
      - name: Install numpy for generated-audio contract tests
        run: python3 -m pip install numpy==2.3.5
      - name: Require an authoring record for every changed skill
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-authoring.py --base "$BASE_SHA"
      - name: Warn when a PR changes existing lint, format, type or test configuration (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/pr_gate.py config-check --base "$BASE_SHA"
      - name: Verify helpers affected by this change, plus the protected set (no model calls)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/run_tests.py --changed-from "$BASE_SHA"
      - name: Verify every helper with synthetic fixtures (no model calls)
        if: github.event_name != 'pull_request'
        run: python3 scripts/run_tests.py
      - name: Verify bundled audit record validators (synthetic data, no target audit)
        run: |
          node --version
          node --test skills/orbyn-security-audit/references/upstream/audit-records/validate-findings.test.cjs skills/orbyn-security-audit/references/upstream/audit-records/validate-coverage-ledger.test.cjs
      - run: git diff --check
