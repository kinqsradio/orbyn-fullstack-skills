name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate library, presets and evaluation cases
        run: python3 scripts/check-library.py
      - name: Verify helpers with synthetic fixtures (no model calls)
        run: python3 -m unittest discover -s tests -v
      - name: Verify bundled audit record validators (synthetic data, no target audit)
        run: |
          node --version
          node --test skills/orbyn-security-audit/references/upstream/audit-records/validate-findings.test.cjs skills/orbyn-security-audit/references/upstream/audit-records/validate-coverage-ledger.test.cjs
      - run: git diff --check
