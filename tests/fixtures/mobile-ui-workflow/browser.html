<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interaction fixture</title><style>body{font:18px system-ui;margin:24px;max-width:720px}button,input{font:inherit;padding:12px}main{display:grid;gap:16px}#panel{padding:24px;background:#dce8fa;overflow-wrap:anywhere}#value,#full{overflow-wrap:anywhere}#gesture{touch-action:pan-y pinch-zoom;width:220px;height:70px;background:#adc8f0}#solid{background:#fff;color:#17243b}@media(prefers-contrast:more){#solid{border:3px solid currentColor}}</style><main><h1>Interaction fixture</h1><button id="toggle" aria-expanded="false" aria-controls="panel">Toggle details</button><section id="panel" hidden inert><input aria-label="Panel input"><button>Panel action</button></section><label>Name <input value="👩🏽‍💻 مرحبا परिवार"></label><p id="value"></p><button id="copy">Show full value</button><output id="full"></output><button id="gesture">Drag or activate</button><output id="commits">0</output><div id="solid">Readable solid fallback</div></main><script type="module">
let active=true,desired=false,animation,generation=0;const panel=document.querySelector('#panel'),toggle=document.querySelector('#toggle'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
function setOpen(open){if(!active)return;desired=open;const owner=++generation,pose=panel.hidden?0:Number(getComputedStyle(panel).opacity);animation?.cancel();panel.hidden=false;panel.inert=!open;toggle.setAttribute('aria-expanded',String(open));if(!open&&panel.contains(document.activeElement))toggle.focus();const finish=()=>{if(owner!==generation)return;panel.hidden=!desired;panel.inert=!desired;panel.style.opacity=String(Number(desired));};if(reduced.matches){finish();return;}animation=panel.animate([{opacity:pose},{opacity:Number(open)}],{duration:180,fill:'forwards'});animation.finished.then(finish,()=>{});}
const preferenceChanged=()=>setOpen(desired);toggle.onclick=()=>setOpen(!desired);reduced.addEventListener('change',preferenceChanged);
const gesture=document.querySelector('#gesture');let pointer=null,origin=0,commits=0,cancelledClick=false;
gesture.onpointerdown=e=>{if(pointer!==null||!e.isPrimary)return;pointer=e.pointerId;origin=e.clientX;gesture.setPointerCapture(pointer);cancelledClick=false;};
gesture.onpointermove=e=>{if(e.pointerId===pointer)gesture.style.transform=`translateX(${Math.max(-80,Math.min(80,e.clientX-origin))}px)`;};
function cancel(e){if(e.pointerId!==pointer)return;const owned=pointer;pointer=null;if(gesture.hasPointerCapture(owned))gesture.releasePointerCapture(owned);cancelledClick=true;gesture.style.transform='';}
gesture.onpointercancel=cancel;gesture.onlostpointercapture=e=>{if(pointer!==null)cancel(e);};gesture.onpointerup=e=>{if(e.pointerId!==pointer)return;pointer=null;gesture.style.transform='';};
gesture.onclick=e=>{if(e.detail!==0&&cancelledClick){cancelledClick=false;return;}cancelledClick=false;document.querySelector('#commits').textContent=String(++commits);};
const seed=73,name='مرحبا👩🏽‍💻é'.repeat(seed);document.querySelector('#value').textContent=name;document.querySelector('#copy').onclick=()=>{document.querySelector('#full').textContent=name;};
window.fixture={setOpen,seed,get pointer(){return pointer;},busy(ms=120){setTimeout(()=>{const end=performance.now()+ms;while(performance.now()<end){}},20);},teardown(){active=false;++generation;animation?.cancel();panel.hidden=true;panel.inert=true;pointer=null;toggle.onclick=null;reduced.removeEventListener('change',preferenceChanged);for(const name of ['onpointerdown','onpointermove','onpointercancel','onlostpointercapture','onpointerup','onclick'])gesture[name]=null;}};
</script></html>
