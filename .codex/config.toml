# Project defaults; parent permissions, providers and MCP settings apply.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
# Standard processing only.
service_tier = "default"

[features]
fast_mode = false
ultrafast_mode = false

[agents]
max_concurrent_threads_per_session = 2

[agents.orbyn-lead]
description = "Planning, architecture, consequential review, security and ambiguous diagnosis"
config_file = "agents/orbyn-lead.toml"

[agents.orbyn-scout]
description = "Bounded mechanical search, extraction and named checks that need no judgement"
config_file = "agents/orbyn-scout.toml"

[agents.orbyn-worker]
description = "Assigned implementation, tests and cleanup"
config_file = "agents/orbyn-worker.toml"
